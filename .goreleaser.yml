project_name: ltmm-content-moderation-service
version: 2

builds:
  - id: mtk
    main: cmd/mtk/main.go
    binary: mtk
    ldflags:
      - -extldflags '-static' -X 'main.version={{.Version}}' -w -s
    env:
      - CGO_ENABLED=0
    goos: [ linux, darwin ]
    goarch: [ amd64, arm64 ]

archives:
  - ids:
      - none

checksum:
  disable: true

#dockers_v2:
#  - id: mtk
#    ids:
#      - mtk
#    images:
#      - "ghcr.io/skpr/mtk"
#    tags:
#      - "v{{ .Version }}"
#      - "latest"
#    sbom: false

dockers:
  - dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/skpr/mtk:v{{ .Version }}-amd64"
      - "ghcr.io/skpr/mtk:latest-amd64"
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
    use: buildx
  - dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/skpr/mtk:v{{ .Version }}-arm64"
      - "ghcr.io/skpr/mtk:latest-arm64"
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
    use: buildx
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/skpr/mtk:v{{ .Version }}"
    image_templates:
      - "ghcr.io/skpr/mtk:v{{ .Version }}-amd64"
      - "ghcr.io/skpr/mtk:v{{ .Version }}-arm64"
  - name_template: "ghcr.io/skpr/mtk:latest"
    image_templates:
      - "ghcr.io/skpr/mtk:latest-amd64"
      - "ghcr.io/skpr/mtk:latest-arm64"

changelog:
  use: github-native
