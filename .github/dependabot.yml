version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"
      gomod-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
    cooldown:
      default-days: 2

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    groups:
      pnpm-deps:
        patterns:
          - "*"
      pnpm-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
    cooldown:
      default-days: 2
