version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: "wednesday"
      time: "07:30"
      timezone: "Australia/Sydney"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      gomod-deps:
        patterns:
          - "*"
        update-types: [ "minor", "patch" ]
      gomod-major-deps:
        patterns:
          - "*"
        update-types: [ "major" ]
      gomod-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
    cooldown:
      default-days: 2

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
      day: "wednesday"
      time: "07:30"
      timezone: "Australia/Sydney"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      pnpm-deps:
        patterns:
          - "*"
        update-types: [ "minor", "patch" ]
      pnpm-major-deps:
        patterns:
          - "*"
        update-types: [ "major" ]
      pnpm-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
    cooldown:
      default-days: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "07:30"
      timezone: "Australia/Sydney"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 2
    groups:
      github-actions-deps:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
      github-actions-major-deps:
        patterns: [ "*" ]
        update-types: [ "major" ]
      github-actions-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
